<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard • SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

  <nav class="breadcrumb mb-2"><span>Home</span> / Dashboard</nav>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="page-title">Dashboard</h1>
    <span class="badge text-bg-warning">DEMO DATA</span>
  </div>
  <div class="row g-3" id="statCards"></div>
  <div class="row g-3 mt-1">
    <div class="col-lg-6"><div class="card-soft p-3"><h2 class="h6">Student Statistics</h2><canvas id="chartGender" height="180"></canvas></div></div>
    <div class="col-lg-6"><div class="card-soft p-3"><h2 class="h6">Attendance Today</h2><canvas id="chartAtt" height="180"></canvas></div></div>
    <div class="col-lg-6"><div class="card-soft p-3"><h2 class="h6">Fee Collection</h2><canvas id="chartFee" height="180"></canvas></div></div>
    <div class="col-lg-6"><div class="card-soft p-3"><h2 class="h6">Admissions by Month</h2><canvas id="chartAdm" height="180"></canvas></div></div>
  </div>
  <div class="row g-3 mt-1">
    <div class="col-lg-6"><div class="card-soft p-3"><h2 class="h6">Upcoming Exams</h2><div id="upExams"></div></div></div>
    <div class="col-lg-6"><div class="card-soft p-3"><h2 class="h6">School Notices</h2><div id="dashNotices"></div></div></div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/page-boot.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
