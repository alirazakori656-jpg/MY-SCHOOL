<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance • SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

  <nav class="breadcrumb mb-2">Home / Attendance</nav>
  <h1 class="page-title mb-3">Attendance</h1>
  <div class="card-soft p-3 mb-3 no-print">
    <div class="row g-2 align-items-end">
      <div class="col-md-3"><label class="form-label" for="attDate">Date</label><input type="date" class="form-control" id="attDate"></div>
      <div class="col-md-3" id="clsWrap"><label class="form-label" for="attClass">Class</label><select class="form-select" id="attClass"></select></div>
      <div class="col-md-2" id="secWrap"><label class="form-label" for="attSec">Section</label><select class="form-select" id="attSec"><option>A</option><option>B</option><option>C</option></select></div>
      <div class="col-md-4">
        <button class="btn btn-outline-success btn-sm" type="button" id="allP">Mark All Present</button>
        <button class="btn btn-outline-danger btn-sm" type="button" id="allA">Mark All Absent</button>
        <button class="btn btn-primary btn-sm" type="button" id="saveAtt">Save Attendance</button>
      </div>
    </div>
  </div>
  <div class="card-soft p-3" id="attBody"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/page-boot.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
