<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports • SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

  <nav class="breadcrumb mb-2">Home / Reports</nav>
  <h1 class="page-title mb-3">Reports</h1>
  <div class="card-soft p-3 no-print mb-3">
    <div class="row g-2">
      <div class="col-md-4"><select class="form-select" id="rType">
        <option value="students">Student List</option>
        <option value="attendance">Attendance Report</option>
        <option value="fees">Fee Collection</option>
        <option value="pending">Pending Fees</option>
        <option value="exams">Exam Results</option>
        <option value="staff">Staff Report</option>
        <option value="admissions">Admission Report</option>
        <option value="teachersAtt">Teacher Attendance</option>
      </select></div>
      <div class="col-md-4"><input class="form-control" id="q" placeholder="Filter"></div>
      <div class="col-md-4">
        <button class="btn btn-outline-secondary btn-sm" onclick="printPage()">Print</button>
        <button class="btn btn-outline-secondary btn-sm" id="csvBtn">Export CSV</button>
      </div>
    </div>
  </div>
  <div class="card-soft p-3 table-responsive" id="out"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/page-boot.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
