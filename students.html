<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students • SMPS Qamber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

  <nav class="breadcrumb mb-2">Home / Students</nav>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="page-title">Students</h1>
    <div class="btn-toolbar gap-2">
      <button class="btn btn-primary btn-sm" id="btnAdd" type="button"><i class="fa-solid fa-plus"></i> Add Student</button>
      <button class="btn btn-outline-secondary btn-sm" type="button" onclick="exportStudents()">Export CSV</button>
    </div>
  </div>
  <div class="card-soft p-3">
    <div class="row g-2 mb-3">
      <div class="col-md-4"><input class="form-control" id="q" placeholder="Search name, ID, admission no."></div>
      <div class="col-md-3"><select class="form-select" id="fClass"><option value="">All classes</option></select></div>
      <div class="col-md-2"><select class="form-select" id="fSec"><option value="">All sections</option><option>A</option><option>B</option><option>C</option></select></div>
      <div class="col-md-3"><select class="form-select" id="fStatus"><option value="">All status</option><option>Active</option><option>Inactive</option></select></div>
    </div>
    <ul class="nav nav-tabs mb-3" id="subTabs">
      <li class="nav-item"><a class="nav-link active" data-tab="list" href="#">All Students</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="promotion" href="#">Promotion</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="documents" href="#">Documents</a></li>
    </ul>
    <div id="tabBody" class="table-responsive"></div>
    <div id="pager" class="mt-2"></div>
  </div>
  <div id="modals"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/page-boot.js"></script>
<script src="js/students.js"></script>
</body>
</html>
